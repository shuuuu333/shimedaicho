<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C9A15A; } a:hover { color: #E0BC7C; }
  </style>
</helmet>
<div style="width: 375px; height: 900px; background: #0B0A09; color: #F2EDE3; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px">
    <div style="font-family: 'Instrument Serif', serif; font-size: 21px; letter-spacing: .04em">締め台帳</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6E6559; letter-spacing: .06em">
      <div style="width: 5px; height: 5px; border-radius: 50%; background: #C9A15A"></div>
      <div>同期済み 2:14</div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 12px; padding: 0 20px 18px">
    <div style="font-family: 'Instrument Serif', serif; font-size: 24px; letter-spacing: .02em">9月</div>
    <div style="font-size: 12px; color: #6E6559; letter-spacing: .1em">2026 ・ 21日</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 2px; border: 1px solid #2A2621; border-radius: 3px; overflow: hidden">
      <div style="padding: 4px 11px; font-size: 11px; background: #C9A15A; color: #0B0A09; font-weight: 700; letter-spacing: .08em">月</div>
      <div style="padding: 4px 11px; font-size: 11px; color: #6E6559; letter-spacing: .08em">年</div>
    </div>
  </div>

  <div style="padding: 0 20px">
    <div style="font-size: 10.5px; letter-spacing: .22em; color: #C9A15A">今月の営業利益</div>
    <div style="font-family: 'Instrument Serif', serif; font-size: 54px; line-height: 1.05; letter-spacing: -.01em; margin: 10px 0 4px">¥1,284,000</div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A79C8B">
      <div>前月 ¥1,142,000</div>
      <div style="color: #2A2621">|</div>
      <div style="color: #C9A15A">+¥142,000</div>
    </div>
  </div>

  <div style="height: 1px; background: #2A2621; margin: 20px 20px 0"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px 20px 18px">
    <div>
      <div style="font-size: 10px; letter-spacing: .16em; color: #6E6559">売上</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 21px; margin-top: 2px">482万</div>
    </div>
    <div>
      <div style="font-size: 10px; letter-spacing: .16em; color: #6E6559">人件費</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 21px; margin-top: 2px">244万</div>
    </div>
    <div>
      <div style="font-size: 10px; letter-spacing: .16em; color: #6E6559">経費</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 21px; margin-top: 2px">110万</div>
    </div>
  </div>

  <div style="height: 1px; background: #2A2621; margin: 0 20px"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px">
    <div style="padding: 16px 0 16px 20px; border-right: 1px solid #2A2621">
      <div style="font-size: 10.5px; letter-spacing: .14em; color: #6E6559">未払いの女子給料</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 27px; margin-top: 3px">¥318,000</div>
    </div>
    <div style="padding: 16px 20px 16px 0">
      <div style="font-size: 10.5px; letter-spacing: .14em; color: #6E6559">手元の現金</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 27px; margin-top: 3px">¥642,500</div>
    </div>
  </div>

  <div style="height: 1px; background: #2A2621; margin: 0 20px"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px">
    <div style="padding: 16px 0 18px 20px; border-right: 1px solid #2A2621">
      <div style="font-size: 10.5px; letter-spacing: .14em; color: #6E6559">カード未回収</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 27px; margin-top: 3px">¥487,200</div>
    </div>
    <div style="padding: 16px 20px 18px 0">
      <div style="font-size: 10.5px; letter-spacing: .14em; color: #6E6559">人件費率</div>
      <div style="font-family: 'Instrument Serif', serif; font-size: 27px; margin-top: 3px">50.5<span style="font-size: 15px">%</span></div>
    </div>
  </div>

  <div style="height: 1px; background: #2A2621; margin: 0 20px 18px"></div>

  <div style="padding: 0 20px">
    <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px">
      <div style="font-size: 11px; letter-spacing: .18em; color: #C9A15A">日別の売上</div>
      <div style="flex-grow: 1"></div>
      <div style="font-size: 10.5px; color: #6E6559; letter-spacing: .08em">現金 ／ カード</div>
    </div>
    <svg viewBox="0 0 335 96" style="display: block; width: 100%; height: 96px">
      <line x1="0" y1="95" x2="335" y2="95" stroke="#2A2621" stroke-width="1"></line>
      <g fill="#C9A15A">
        <rect x="2" y="52" width="7" height="43"></rect><rect x="17" y="38" width="7" height="57"></rect>
        <rect x="32" y="61" width="7" height="34"></rect><rect x="47" y="30" width="7" height="65"></rect>
        <rect x="62" y="44" width="7" height="51"></rect><rect x="77" y="24" width="7" height="71"></rect>
        <rect x="92" y="18" width="7" height="77"></rect><rect x="107" y="57" width="7" height="38"></rect>
        <rect x="122" y="41" width="7" height="54"></rect><rect x="137" y="34" width="7" height="61"></rect>
        <rect x="152" y="66" width="7" height="29"></rect><rect x="167" y="27" width="7" height="68"></rect>
        <rect x="182" y="21" width="7" height="74"></rect><rect x="197" y="48" width="7" height="47"></rect>
        <rect x="212" y="36" width="7" height="59"></rect><rect x="227" y="12" width="7" height="83"></rect>
        <rect x="242" y="55" width="7" height="40"></rect><rect x="257" y="43" width="7" height="52"></rect>
        <rect x="272" y="31" width="7" height="64"></rect><rect x="287" y="16" width="7" height="79"></rect>
        <rect x="302" y="50" width="7" height="45"></rect>
      </g>
      <g fill="#4A4233">
        <rect x="2" y="43" width="7" height="9"></rect><rect x="17" y="26" width="7" height="12"></rect>
        <rect x="32" y="54" width="7" height="7"></rect><rect x="47" y="16" width="7" height="14"></rect>
        <rect x="62" y="34" width="7" height="10"></rect><rect x="77" y="13" width="7" height="11"></rect>
        <rect x="92" y="6" width="7" height="12"></rect><rect x="107" y="49" width="7" height="8"></rect>
        <rect x="122" y="30" width="7" height="11"></rect><rect x="137" y="22" width="7" height="12"></rect>
        <rect x="152" y="59" width="7" height="7"></rect><rect x="167" y="16" width="7" height="11"></rect>
        <rect x="182" y="9" width="7" height="12"></rect><rect x="197" y="38" width="7" height="10"></rect>
        <rect x="212" y="25" width="7" height="11"></rect><rect x="227" y="3" width="7" height="9"></rect>
        <rect x="242" y="46" width="7" height="9"></rect><rect x="257" y="33" width="7" height="10"></rect>
        <rect x="272" y="20" width="7" height="11"></rect><rect x="287" y="6" width="7" height="10"></rect>
        <rect x="302" y="41" width="7" height="9"></rect>
      </g>
    </svg>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 20px 18px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid #C9A15A; border-radius: 2px">
      <div style="font-family: 'Instrument Serif', serif; font-size: 17px; color: #C9A15A">今日の日報をつける</div>
      <div style="flex-grow: 1"></div>
      <div style="font-size: 12px; color: #6E6559; letter-spacing: .06em">9/21（月）</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2621; padding: 10px 0 14px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #C9A15A">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"></path></svg>
      <div style="font-size: 10px; letter-spacing: .1em">今月</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6E6559">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"></rect><path d="M3.5 9.5h17M8 3v3m8-3v3"></path></svg>
      <div style="font-size: 10px; letter-spacing: .1em">日報</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6E6559">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path></svg>
      <div style="font-size: 10px; letter-spacing: .1em">キャスト</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6E6559">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m10.8 0-1.6-1.6M9.2 9.2 7.6 7.6"></path></svg>
      <div style="font-size: 10px; letter-spacing: .1em">設定</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
