<!doctype html>
<html>

<x-dc>
<helmet>

</helmet>

      <div style="width: 6px; height: 6px; border-radius: 50%; background: #47D18F"></div>
      <div style="font-family: 'IBM Plex Mono', monospace">SYNCED 2:14</div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #0F1219; border-radius: 7px">

    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 4px 0 12px">¥1,284,000</div>
    <div style="display: flex; height: 7px; border-radius: 4px; overflow: hidden; gap: 2px">
      <div style="width: 50.5%; background: #35C08A"></div>
      <div style="width: 22.8%; background: #E0A02E"></div>

    <div style="display: flex; gap: 14px; margin-top: 9px; font-size: 11px; color: #9BA6B8">

    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0">
    <div style="padding: 11px 12px; background: #0F1219; border-radius: 10px">
      <div style="font-size: 10.5px; color: #7A8699; font-weight: 500">売上</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px">¥4,820,000</div>
    </div>
    <div style="padding: 11px 12px; background: #0F1219; border-radius: 10px">
      <div style="font-size: 10.5px; color: #7A8699; font-weight: 500">客単価</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px">¥23,400</div>
    </div>
    <div style="padding: 11px 12px; background: #0F1219; border-radius: 10px">
      <div style="font-size: 10.5px; color: #7A8699; font-weight: 500">未払い給料</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px; color: #FFB84D">¥318,000</div>
    </div>
    <div style="padding: 11px 12px; background: #0F1219; border-radius: 10px">
      <div style="font-size: 10.5px; color: #7A8699; font-weight: 500">手元の現金</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px">¥642,500</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 20px 16px 8px">
    <div style="font-size: 11px; color: #7A8699; font-weight: 600; letter-spacing: .1em">日別の売上</div>
    <div style="flex-grow: 1; height: 1px; background: #1A1F29"></div>
  </div>

  <div style="padding: 0 16px">

      <line x1="0" y1="60" x2="343" y2="60" stroke="#161B24" stroke-width="1"></line>
      <line x1="0" y1="94" x2="343" y2="94" stroke="#242B36" stroke-width="1"></line>

        <rect x="258" y="57" width="9" height="37" rx="1.5"></rect><rect x="274" y="45" width="9" height="49" rx="1.5"></rect>
        <rect x="290" y="33" width="9" height="61" rx="1.5"></rect><rect x="306" y="19" width="9" height="75" rx="1.5"></rect>
        <rect x="322" y="52" width="9" height="42" rx="1.5"></rect>

        <rect x="66" y="36" width="9" height="9" rx="1.5"></rect><rect x="82" y="16" width="9" height="10" rx="1.5"></rect>

        <rect x="130" y="32" width="9" height="10" rx="1.5"></rect><rect x="146" y="24" width="9" height="11" rx="1.5"></rect>
        <rect x="162" y="61" width="9" height="6" rx="1.5"></rect><rect x="178" y="19" width="9" height="10" rx="1.5"></rect>

        <rect x="290" y="22" width="9" height="10" rx="1.5"></rect><rect x="306" y="9" width="9" height="9" rx="1.5"></rect>
        <rect x="322" y="43" width="9" height="8" rx="1.5"></rect>
      </g>
    </svg>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
    <div style="font-size: 11px; color: #7A8699; font-weight: 600; letter-spacing: .1em">直近の日報</div>
    <div style="flex-grow: 1; height: 1px; background: #1A1F29"></div>
  </div>

  <div style="padding: 0 16px">
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid #12161D">
      <div style="width: 62px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #9BA6B8">09-20 日</div>
      <div style="flex-grow: 1; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px">248,000</div>
      <div style="width: 78px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #47D18F">+149,600</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid #12161D">
      <div style="width: 62px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #9BA6B8">09-19 土</div>
      <div style="flex-grow: 1; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px">386,500</div>
      <div style="width: 78px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #47D18F">+241,300</div>

      <div style="width: 78px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #FF6B60">−18,400</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 16px 14px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; background: #5B9CFF; color: #08090C; border-radius: 10px; font-size: 15px; font-weight: 600">
      今日の日報をつける
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; opacity: .7">09-21</span>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #1A1F29; padding: 9px 0 13px; background: #0B0D12">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5B9CFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"></path></svg>
      <div style="font-size: 10px; font-weight: 600">今月</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #626D7E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"></rect><path d="M3.5 9.5h17M8 3v3m8-3v3"></path></svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #626D7E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m10.8 0-1.6-1.6M9.2 9.2 7.6 7.6"></path></svg>
      <div style="font-size: 10px; font-weight: 600">設定</div>
