<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E8B44F; } a:hover { color: #F3C978; }
  </style>
</helmet>
<div style="width: 375px; height: 900px; background: #14120F; color: #F6F0E4; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px">
    <div style="font-size: 18px; font-weight: 700; letter-spacing: .02em">締め台帳</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #201C18; font-size: 11.5px; color: #B3A895">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: #5FBF8C"></div>
      <div>同期済み</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 18px 16px">
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #201C18; border-radius: 12px; color: #B3A895; font-size: 15px">‹</div>
    <div style="font-size: 20px; font-weight: 700">9月</div>
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #201C18; border-radius: 12px; color: #B3A895; font-size: 15px">›</div>
    <div style="flex-grow: 1"></div>
    <div style="text-align: right">
      <div style="font-size: 11px; color: #7A7263">未払い計</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 19px; font-weight: 700; color: #E8B44F">¥318,000</div>
    </div>
  </div>

  <div style="padding: 0 18px">
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px; background: #201C18; border-radius: 18px; margin-bottom: 9px">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: #3A2E15; color: #E8B44F; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">あ</div>
      <div style="flex-grow: 1">
        <div style="font-size: 16px; font-weight: 700">あい</div>
        <div style="font-size: 11.5px; color: #7A7263">15日 ・ 82.5時間</div>
      </div>
      <div style="text-align: right">
        <div style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700">¥312,000</div>
        <div style="font-size: 11.5px; color: #E8B44F">未払い 45,000</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px; background: #201C18; border-radius: 18px; margin-bottom: 9px">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: #3A2E15; color: #E8B44F; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">み</div>
      <div style="flex-grow: 1">
        <div style="font-size: 16px; font-weight: 700">みく</div>
        <div style="font-size: 11.5px; color: #7A7263">12日 ・ 64.0時間</div>
      </div>
      <div style="text-align: right">
        <div style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700">¥268,400</div>
        <div style="font-size: 11.5px; color: #E8B44F">未払い 86,000</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px; background: #201C18; border-radius: 18px; margin-bottom: 9px">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: #2A251F; color: #B3A895; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">れ</div>
      <div style="flex-grow: 1">
        <div style="font-size: 16px; font-weight: 700">れな</div>
        <div style="font-size: 11.5px; color: #7A7263">9日 ・ 48.5時間</div>
      </div>
      <div style="text-align: right">
        <div style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700">¥184,200</div>
        <div style="font-size: 11.5px; color: #5FBF8C">支払いずみ</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px; background: #201C18; border-radius: 18px">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: #2A251F; color: #B3A895; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">ゆ</div>
      <div style="flex-grow: 1">
        <div style="font-size: 16px; font-weight: 700">ゆき <span style="font-size: 11px; color: #7A7263; font-weight: 500">派遣</span></div>
        <div style="font-size: 11.5px; color: #7A7263">2日 ・ 日給 15,000</div>
      </div>
      <div style="text-align: right">
        <div style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700">¥31,400</div>
        <div style="font-size: 11.5px; color: #E8B44F">未払い 28,000</div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 18px 10px">
    <div style="font-size: 16px; font-weight: 700">未払いの精算</div>
    <div style="font-size: 12.5px; color: #B3A895; margin-top: 1px">渡したら押してください。今日の日報に記録されます</div>
  </div>

  <div style="padding: 0 18px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #201C18; border-radius: 999px; margin-bottom: 8px">
      <div style="flex-grow: 1; font-size: 15px; font-weight: 700">あい</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 700">¥45,000</div>
      <div style="padding: 9px 16px; background: #E8B44F; color: #14120F; border-radius: 999px; font-size: 13px; font-weight: 700">渡した</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #201C18; border-radius: 999px">
      <div style="flex-grow: 1; font-size: 15px; font-weight: 700">みく</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 700">¥86,000</div>
      <div style="padding: 9px 16px; background: #E8B44F; color: #14120F; border-radius: 999px; font-size: 13px; font-weight: 700">渡した</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 18px 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 15px 18px; border: 1.5px solid #322D26; border-radius: 999px">
      <div style="font-size: 14.5px; font-weight: 700; color: #B3A895">全員まとめて渡した</div>
      <div style="flex-grow: 1"></div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700; color: #E8B44F">¥159,000</div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1B1815; border-top: 1px solid #262220; padding: 10px 0 15px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">今月</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"></rect><path d="M3.5 9.5h17M8 3v3m8-3v3"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">日報</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #E8B44F">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; background: #3A2E15; border-radius: 999px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 700">キャスト</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m10.8 0-1.6-1.6M9.2 9.2 7.6 7.6"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">設定</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
