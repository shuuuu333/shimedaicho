<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E8B44F; } a:hover { color: #F3C978; }
  </style>
</helmet>
<div style="width: 375px; height: 900px; background: #14120F; color: #F6F0E4; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px">
    <div style="font-size: 18px; font-weight: 700; letter-spacing: .02em">締め台帳</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #201C18; font-size: 11.5px; color: #B3A895">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: #5FBF8C"></div>
      <div>同期済み</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 18px 14px">
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #201C18; border-radius: 12px; color: #B3A895; font-size: 15px">‹</div>
    <div style="font-size: 20px; font-weight: 700">9月</div>
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #201C18; border-radius: 12px; color: #B3A895; font-size: 15px">›</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; background: #201C18; border-radius: 999px; padding: 4px">
      <div style="padding: 6px 15px; border-radius: 999px; background: #E8B44F; color: #14120F; font-size: 12.5px; font-weight: 700">月</div>
      <div style="padding: 6px 15px; font-size: 12.5px; color: #7A7263">年</div>
    </div>
  </div>

  <div style="margin: 0 18px; padding: 20px 20px 18px; background: #201C18; border-radius: 22px">
    <div style="font-size: 12.5px; color: #B3A895">今月の営業利益</div>
    <div style="font-family: 'Archivo', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 6px">¥1,284,000</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="padding: 4px 11px; border-radius: 999px; background: #1D3A2B; color: #5FBF8C; font-size: 12px; font-weight: 700">前月より +14万</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #322D26">
      <div>
        <div style="font-size: 11.5px; color: #7A7263">売上</div>
        <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; margin-top: 1px">482万</div>
      </div>
      <div>
        <div style="font-size: 11.5px; color: #7A7263">人件費率</div>
        <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; margin-top: 1px">50.5%</div>
      </div>
      <div>
        <div style="font-size: 11.5px; color: #7A7263">客単価</div>
        <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; margin-top: 1px">2.3万</div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 18px 0">
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #E8B44F; border-radius: 20px">
      <div>
        <div style="font-size: 16.5px; font-weight: 700; color: #14120F">今日の日報をつける</div>
        <div style="font-size: 12px; color: #6B5322; margin-top: 1px">9月21日（月）・ 3分で終わります</div>
      </div>
      <div style="flex-grow: 1"></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14120F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 18px 0">
    <div style="padding: 14px 16px; background: #201C18; border-radius: 18px">
      <div style="font-size: 11.5px; color: #B3A895">未払いの給料</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700; margin-top: 3px">¥318,000</div>
      <div style="font-size: 11px; color: #7A7263; margin-top: 1px">3名ぶん</div>
    </div>
    <div style="padding: 14px 16px; background: #201C18; border-radius: 18px">
      <div style="font-size: 11.5px; color: #B3A895">手元の現金</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700; margin-top: 3px">¥642,500</div>
      <div style="font-size: 11px; color: #5FBF8C; margin-top: 1px">実査と一致</div>
    </div>
    <div style="padding: 14px 16px; background: #201C18; border-radius: 18px">
      <div style="font-size: 11.5px; color: #B3A895">カード未回収</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700; margin-top: 3px">¥487,200</div>
      <div style="font-size: 11px; color: #7A7263; margin-top: 1px">手数料 5%</div>
    </div>
    <div style="padding: 14px 16px; background: #201C18; border-radius: 18px">
      <div style="font-size: 11.5px; color: #B3A895">今月の経費</div>
      <div style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700; margin-top: 3px">¥286,000</div>
      <div style="font-size: 11px; color: #7A7263; margin-top: 1px">固定費 別</div>
    </div>
  </div>

  <div style="margin: 14px 18px 0; padding: 16px 18px 14px; background: #201C18; border-radius: 20px">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
      <div style="font-size: 13.5px; font-weight: 700">日別の売上</div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; gap: 12px; font-size: 11px; color: #7A7263">
        <div style="display: flex; align-items: center; gap: 5px"><div style="width: 8px; height: 8px; border-radius: 3px; background: #E8B44F"></div>現金</div>
        <div style="display: flex; align-items: center; gap: 5px"><div style="width: 8px; height: 8px; border-radius: 3px; background: #C98A5A"></div>カード</div>
      </div>
    </div>
    <svg viewBox="0 0 303 84" style="display: block; width: 100%; height: 84px">
      <g fill="#E8B44F">
        <rect x="0" y="45" width="8" height="39" rx="3"></rect><rect x="14" y="34" width="8" height="50" rx="3"></rect>
        <rect x="28" y="56" width="8" height="28" rx="3"></rect><rect x="42" y="27" width="8" height="57" rx="3"></rect>
        <rect x="56" y="40" width="8" height="44" rx="3"></rect><rect x="70" y="22" width="8" height="62" rx="3"></rect>
        <rect x="84" y="17" width="8" height="67" rx="3"></rect><rect x="98" y="52" width="8" height="32" rx="3"></rect>
        <rect x="112" y="37" width="8" height="47" rx="3"></rect><rect x="126" y="31" width="8" height="53" rx="3"></rect>
        <rect x="140" y="60" width="8" height="24" rx="3"></rect><rect x="154" y="25" width="8" height="59" rx="3"></rect>
        <rect x="168" y="20" width="8" height="64" rx="3"></rect><rect x="182" y="43" width="8" height="41" rx="3"></rect>
        <rect x="196" y="33" width="8" height="51" rx="3"></rect><rect x="210" y="12" width="8" height="72" rx="3"></rect>
        <rect x="224" y="50" width="8" height="34" rx="3"></rect><rect x="238" y="39" width="8" height="45" rx="3"></rect>
        <rect x="252" y="28" width="8" height="56" rx="3"></rect><rect x="266" y="15" width="8" height="69" rx="3"></rect>
        <rect x="280" y="45" width="8" height="39" rx="3"></rect>
      </g>
      <g fill="#C98A5A">
        <rect x="0" y="37" width="8" height="8" rx="3"></rect><rect x="14" y="24" width="8" height="10" rx="3"></rect>
        <rect x="28" y="50" width="8" height="6" rx="3"></rect><rect x="42" y="16" width="8" height="11" rx="3"></rect>
        <rect x="56" y="31" width="8" height="9" rx="3"></rect><rect x="70" y="12" width="8" height="10" rx="3"></rect>
        <rect x="84" y="7" width="8" height="10" rx="3"></rect><rect x="98" y="45" width="8" height="7" rx="3"></rect>
        <rect x="112" y="28" width="8" height="9" rx="3"></rect><rect x="126" y="21" width="8" height="10" rx="3"></rect>
        <rect x="140" y="54" width="8" height="6" rx="3"></rect><rect x="154" y="16" width="8" height="9" rx="3"></rect>
        <rect x="168" y="10" width="8" height="10" rx="3"></rect><rect x="182" y="34" width="8" height="9" rx="3"></rect>
        <rect x="196" y="24" width="8" height="9" rx="3"></rect><rect x="210" y="3" width="8" height="9" rx="3"></rect>
        <rect x="224" y="43" width="8" height="7" rx="3"></rect><rect x="238" y="30" width="8" height="9" rx="3"></rect>
        <rect x="252" y="19" width="8" height="9" rx="3"></rect><rect x="266" y="6" width="8" height="9" rx="3"></rect>
        <rect x="280" y="37" width="8" height="8" rx="3"></rect>
      </g>
    </svg>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1B1815; border-top: 1px solid #262220; padding: 10px 0 15px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #E8B44F">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; background: #3A2E15; border-radius: 999px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 700">今月</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"></rect><path d="M3.5 9.5h17M8 3v3m8-3v3"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">日報</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">キャスト</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7A7263">
      <div style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m10.8 0-1.6-1.6M9.2 9.2 7.6 7.6"></path></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 500">設定</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
