<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4C9AFF; } a:hover { opacity: .8; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0D11; color: #FFFFFF; font-family: 'IBM Plex Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
    <div style="font-size: 15.5px; font-weight: 700; letter-spacing: .01em">締め台帳</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #10281F">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: #3DBE8B"></div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3DBE8B; font-weight: 500">2:14 同期</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 2px 16px 12px">
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #1B1F28; border-radius: 11px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA5B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></div>
    <div style="flex-grow: 1; text-align: center">
      <div style="font-size: 19px; font-weight: 700">9月21日（月）</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #626C7D; margin-top: -2px">今日</div>
    </div>
    <div style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #1B1F28; border-radius: 11px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA5B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 0 16px 14px">
    <div style="text-align: center"><div style="height: 3px; border-radius: 2px; background: #4C9AFF"></div><div style="font-size: 10px; color: #9AA5B8; font-weight: 500; margin-top: 6px">売上</div></div>
    <div style="text-align: center"><div style="height: 3px; border-radius: 2px; background: #4C9AFF"></div><div style="font-size: 10px; color: #4C9AFF; font-weight: 600; margin-top: 6px">出勤</div></div>
    <div style="text-align: center"><div style="height: 3px; border-radius: 2px; background: #2C323E"></div><div style="font-size: 10px; color: #626C7D; font-weight: 500; margin-top: 6px">派遣</div></div>
    <div style="text-align: center"><div style="height: 3px; border-radius: 2px; background: #2C323E"></div><div style="font-size: 10px; color: #626C7D; font-weight: 500; margin-top: 6px">経費</div></div>
    <div style="text-align: center"><div style="height: 3px; border-radius: 2px; background: #2C323E"></div><div style="font-size: 10px; color: #626C7D; font-weight: 500; margin-top: 6px">締め</div></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 16px; padding: 11px 14px; background: #14171E; border: 1px solid #232833; border-radius: 14px; box-shadow: none">
    <div>
      <div style="font-size: 10.5px; color: #626C7D; font-weight: 500">売上</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">248,000</div>
    </div>
    <div>
      <div style="font-size: 10.5px; color: #626C7D; font-weight: 500">人件費</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">86,400</div>
    </div>
    <div>
      <div style="font-size: 10.5px; color: #626C7D; font-weight: 500">差引</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #3DBE8B">149,600</div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 9px; padding: 20px 16px 12px">
    <div style="font-size: 21px; font-weight: 700">出勤</div>
    <div style="font-size: 12px; color: #626C7D">出た子をタップ</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px">
    <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; background: #4C9AFF; color: #0B0D11; font-size: 14.5px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>あい</div>
    <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; background: #4C9AFF; color: #0B0D11; font-size: 14.5px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"></path></svg>みく</div>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #1B1F28; color: #9AA5B8; font-size: 14.5px; font-weight: 500">れな</div>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #1B1F28; color: #9AA5B8; font-size: 14.5px; font-weight: 500">さら</div>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #1B1F28; color: #9AA5B8; font-size: 14.5px; font-weight: 500">ひな</div>
  </div>

  <div style="padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: #14171E; border: 1px solid #232833; border-radius: 14px; margin-bottom: 9px; box-shadow: none">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: #1B1F28; color: #9AA5B8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">あ</div>
      <div style="flex-grow: 1">
        <div style="font-size: 15.5px; font-weight: 600">あい</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #626C7D">20:30-01:00 · 4.5h · バック 7,500</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600">15,600</div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#626C7D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: #14171E; border: 1px solid #FF5A52; border-radius: 14px; box-shadow: none">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: #1B1F28; color: #9AA5B8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">み</div>
      <div style="flex-grow: 1">
        <div style="font-size: 15.5px; font-weight: 600">みく</div>
        <div style="font-size: 11.5px; color: #FF5A52; font-weight: 500">本数がまだ入っていません</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600">12,500</div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#626C7D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 0">
    <div style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; background: #1B1F28; border-radius: 10px; font-size: 12.5px; color: #9AA5B8; font-weight: 500">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
      前回の出勤をコピー
    </div>
    <div style="flex-grow: 1"></div>
    <div style="text-align: right">
      <div style="font-size: 10.5px; color: #626C7D">在籍 2名の給料計</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">28,100</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 9px; padding: 0 16px 12px">
    <div style="display: flex; align-items: center; justify-content: center; width: 88px; height: 52px; background: #1B1F28; border-radius: 14px; font-size: 15px; font-weight: 600; color: #9AA5B8">戻る</div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; background: #4C9AFF; color: #0B0D11; border-radius: 14px; font-size: 15.5px; font-weight: 600">
      次へ：派遣
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #0E1116; border-top: 1px solid #232833; padding: 6px 0 14px">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 52px; color: #626C7D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"></path></svg><div style="font-size: 10.5px; font-weight: 500; letter-spacing: .02em">今月</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 52px; color: #4C9AFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"></rect><path d="M3.5 9.5h17M8 3v3m8-3v3"></path></svg><div style="font-size: 10.5px; font-weight: 600; letter-spacing: .02em">日報</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 52px; color: #626C7D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path></svg><div style="font-size: 10.5px; font-weight: 500; letter-spacing: .02em">キャスト</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 52px; color: #626C7D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m10.8 0-1.6-1.6M9.2 9.2 7.6 7.6"></path></svg><div style="font-size: 10.5px; font-weight: 500; letter-spacing: .02em">設定</div></div>
  </div>

</div>
</x-dc>
</body>
</html>
