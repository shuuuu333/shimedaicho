    <text x="88" y="356" font-size="76" font-weight="700" fill="#14171E">毎日 3 分に。</text>
    <text x="88" y="436" font-size="32" fill="#5C6779">レジで打った会計が、そのまま日報と給料計算になります。</text>
    <g transform="translate(88,476)">
      <rect x="0" y="0" width="196" height="62" rx="16" fill="#FFFFFF" stroke="#E3E6EB"/>
