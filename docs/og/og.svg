      <rect x="216" y="0" width="238" height="62" rx="16" fill="#FFFFFF" stroke="#E3E6EB"/>
      <text x="335" y="40" font-size="26" font-weight="600" fill="#14171E" text-anchor="middle">電波が無くても動く</text>
      <rect x="486" y="0" width="268" height="62" rx="16" fill="#FFFFFF" stroke="#E3E6EB"/>
      <text x="620" y="40" font-size="26" font-weight="600" fill="#14171E" text-anchor="middle">バック・日払い・ツケ</text>
    </g>
    <text x="88" y="596" font-size="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#8A93A3">shuuuu333.github.io/shimedaicho</text>
